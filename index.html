      // Compatibility shim for environments/tools where window.fetch is a getter-only property

          var origFetch = window.fetch;
          if (typeof origFetch === 'function') {
            var _current = function() {
              return origFetch.apply(window, arguments);
            };
            var descriptor = {
              get: function() {
                return _current;
              },
              set: function(newFetch) {
                _current = newFetch;
              },
              configurable: true,
              enumerable: true,
            };
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (_) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', descriptor);
              } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
